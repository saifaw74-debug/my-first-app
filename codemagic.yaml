workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          flutter create . --platforms=android --project-name taxi_basra || true
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
